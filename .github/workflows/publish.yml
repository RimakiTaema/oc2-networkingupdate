name: publish

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (<mc-version>/<mod-version>, like a release tag)"
        required: true
      publish:
        description: "Publish to the fnuecke/maven repository"
        type: boolean
        default: false
      publish_mods:
        description: "Publish the built JARs to Modrinth and CurseForge"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ github.event.release.tag_name || inputs.version }}
  SHOULD_PUBLISH_MAVEN: ${{ github.event_name == 'release' || inputs.publish }}

jobs:
  native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            platform: linux-x86_64
            install: sudo apt-get update && sudo apt-get install -y libslirp-dev cmake
            generator: ""
          - os: windows-latest
            shell: msys2 {0}
            platform: windows-x86_64
            install: pacman --noconfirm -S --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-libslirp mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            generator: -G Ninja
          - os: macos-14
            shell: bash
            platform: macos-aarch64
            install: brew install libslirp cmake
            generator: ""
          - os: macos-15-intel
            shell: bash
            platform: macos-x86_64
            install: brew install libslirp cmake
            generator: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - run: ${{ matrix.install }}
      - if: runner.os != 'macOS'
        run: cmake -S native/libslirp -B build/native ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release
      - if: runner.os == 'macOS'
        run: cmake -S native/libslirp -B build/native -DCMAKE_BUILD_TYPE=Release -DSLIRP_INCLUDE_DIR="$(brew --prefix libslirp)/include" -DSLIRP_LIBRARY="$(brew --prefix libslirp)/lib/libslirp.dylib"
      - run: cmake --build build/native
      - run: ./build/native/oc2-slirp-smoke
      - if: runner.os == 'Linux'
        run: mkdir -p native-package/${{ matrix.platform }} && cp build/native/liboc2slirp.so native-package/${{ matrix.platform }}/liboc2slirp.so
      - if: runner.os == 'Windows'
        run: mkdir -p native-package/${{ matrix.platform }} && cp build/native/liboc2slirp.dll native-package/${{ matrix.platform }}/oc2slirp.dll
      - if: runner.os == 'macOS'
        run: mkdir -p native-package/${{ matrix.platform }} && cp build/native/liboc2slirp.dylib native-package/${{ matrix.platform }}/liboc2slirp.dylib
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: native-package

  build:
    needs: native
    runs-on: ubuntu-latest
    outputs:
      mc_version: ${{ steps.split_tag.outputs.mc_version }}
      mod_version: ${{ steps.split_tag.outputs.mod_version }}

    steps:
      - uses: actions/checkout@v7

      - name: Extract Version from Tag
        id: split_tag
        run: |
          if [[ "$VERSION" != */* ]]; then
            echo "Version must be of the form <mc-version>/<mod-version>: $VERSION"
            exit 1
          fi
          parts=(${VERSION//\// })
          echo "mc_version=${parts[0]}" >> $GITHUB_OUTPUT
          echo "mod_version=${parts[1]}" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native-package
          merge-multiple: true
      - name: Build with Gradle
        run: ./gradlew -PmodVersion='${{ steps.split_tag.outputs.mod_version }}' -PnativeLibDir='${{ github.workspace }}/native-package' build

      - name: Remove shadow JARs
        run: |
          rm fabric/build/libs/*-dev-shadow.jar
          rm neoforge/build/libs/*-dev-shadow.jar

      - name: Add Artifacts to Github Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' \
            ./fabric/build/libs/*.jar \
            ./neoforge/build/libs/*.jar \
            ./build/libs/*-api*.jar \
            --clobber

      - uses: actions/upload-artifact@v7
        name: Upload Artifacts
        id: upload-artifacts
        with:
          name: jar-files
          path: |
            ./fabric/build/libs/*.jar
            ./neoforge/build/libs/*.jar
            ./build/libs/*-api*.jar
          retention-days: 1

      - name: Check out the static Maven repository
        if: env.SHOULD_PUBLISH_MAVEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: fnuecke/maven
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          path: maven

      - name: Publish to the static Maven repository
        if: env.SHOULD_PUBLISH_MAVEN == 'true'
        run: >-
          ./gradlew publish
          -PmodVersion='${{ steps.split_tag.outputs.mod_version }}'
          -PmavenRepoDir="${{ github.workspace }}/maven"

      - name: Commit and push the static Maven repository
        if: env.SHOULD_PUBLISH_MAVEN == 'true'
        working-directory: maven
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "oc2 $VERSION"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          echo "Failed to push after 5 attempts."
          exit 1

  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_mods)
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, neoforge ]
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: jar-files

      - name: Publish (${{ matrix.loader }})
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          name: ${{ github.event.repository.name }}-MC${{ needs.build.outputs.mc_version }}-${{ needs.build.outputs.mod_version }}
          version: MC${{ needs.build.outputs.mc_version }}-${{ matrix.loader }}-${{ needs.build.outputs.mod_version }}
          java: Java 21

          files: ${{ matrix.loader }}/build/libs/!(*-@(dev|dev-shadow|sources)).jar

          fail-mode: skip

          modrinth-id: b0YVdq8k
          modrinth-token: ${{ secrets.MODRINTH_API_KEY }}
