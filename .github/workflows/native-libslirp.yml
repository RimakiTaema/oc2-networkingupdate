name: Native libslirp bridge

on:
  push:
    paths:
      - 'native/libslirp/**'
      - '.github/workflows/native-libslirp.yml'
  pull_request:
    paths:
      - 'native/libslirp/**'
      - '.github/workflows/native-libslirp.yml'

jobs:
  native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            install: sudo apt-get update && sudo apt-get install -y libslirp-dev cmake
            generator: ""
          - os: windows-latest
            shell: msys2 {0}
            install: pacman --noconfirm -S --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-libslirp mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            generator: -G Ninja
          - os: macos-14
            shell: bash
            install: brew install libslirp cmake
            generator: ""
          - os: macos-15-intel
            shell: bash
            install: brew install libslirp cmake
            generator: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - run: ${{ matrix.install }}
      - if: runner.os != 'macOS'
        run: cmake -S native/libslirp -B build/native ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release
      - if: runner.os == 'macOS'
        run: cmake -S native/libslirp -B build/native -DCMAKE_BUILD_TYPE=Release -DSLIRP_INCLUDE_DIR="$(brew --prefix libslirp)/include" -DSLIRP_LIBRARY="$(brew --prefix libslirp)/lib/libslirp.dylib"
      - run: cmake --build build/native
      - run: ./build/native/oc2-slirp-smoke
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: oc2slirp-linux
          path: build/native/liboc2slirp.so
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: oc2slirp-windows
          path: build/native/liboc2slirp.dll
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: oc2slirp-macos
          path: build/native/liboc2slirp.dylib
